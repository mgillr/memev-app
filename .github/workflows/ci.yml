name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/leak-scan.mjs --history
      - run: node scripts/fence.mjs
      - run: node --test test/fence.test.mjs
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux toolkit
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev xvfb lsof
      - name: Build and test the Linux window
        run: make -C native/linux test
  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test the Linux CLI installer in-job
        run: |
          set -eux
          node --version
          node --test installers/cli/test/isolated-linux.mjs
          # Discard the package so it cannot be mistaken for a publishable Actions artifact.
          rm -rf installers/cli/dist installers/cli/.cache
          test ! -e installers/cli/dist
